<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#111210" />
  <title>CulinArch.AI</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111210;
      --text: #eeeae2;
      --muted: #8b877d;
      --accent: #9fbfba;
      --warm: #a99d88;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background:
        radial-gradient(circle at 62% 26%, rgba(132, 123, 98, .1), transparent 40%),
        radial-gradient(circle at 12% 78%, rgba(159, 191, 186, .045), transparent 34%),
        linear-gradient(135deg, #0e0f0e 0%, #151713 54%, #0d0e0d 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
      min-height: 100svh;
      overflow: hidden;
    }

    /* faint structural grid */
    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .3;
      background-image:
        linear-gradient(rgba(255,255,255,.014) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.01) 1px, transparent 1px);
      background-size: 88px 88px;
      mask-image: radial-gradient(circle at 50% 44%, #000 0%, transparent 78%);
    }

    /* slow breathing aura */
    .aura {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 46%, rgba(159,191,186,.05), transparent 52%);
      animation: breathe 9s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { opacity: .5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.06); }
    }

    main {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 40px 28px;
      max-width: 620px;
    }

    .mark {
      width: 46px;
      height: 46px;
      margin: 0 auto 44px;
      border: 1px solid rgba(159,191,186,.3);
      border-radius: 50%;
      box-shadow: 0 0 32px rgba(159,191,186,.1) inset, 0 0 26px rgba(159,191,186,.08);
      position: relative;
      animation: pulse 6s ease-in-out infinite;
    }
    .mark::after {
      content: '';
      position: absolute;
      inset: 40%;
      border-radius: 50%;
      background: var(--accent);
      opacity: .55;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 32px rgba(159,191,186,.1) inset, 0 0 22px rgba(159,191,186,.06); }
      50% { box-shadow: 0 0 40px rgba(159,191,186,.16) inset, 0 0 40px rgba(159,191,186,.14); }
    }

    h1 {
      margin: 0 0 34px;
      font-family: Georgia, serif;
      font-size: clamp(38px, 6vw, 66px);
      font-weight: 400;
      letter-spacing: -.05em;
      line-height: 1;
    }
    h1 .dot { color: var(--accent); }

    .line {
      margin: 0 auto;
      max-width: 380px;
      color: var(--muted);
      font-size: clamp(14px, 2.4vw, 17px);
      line-height: 1.8;
    }

    .status {
      margin-top: 44px;
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: var(--warm);
      font: 11px ui-monospace, monospace;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    .status .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      animation: blink 2.4s ease-in-out infinite;
    }
    @keyframes blink { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

    .fade { opacity: 0; transform: translateY(14px); animation: rise 1.1s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1 { animation-delay: .2s; }
    .d2 { animation-delay: .4s; }
    .d3 { animation-delay: .6s; }
    .d4 { animation-delay: .8s; }
    @keyframes rise { to { opacity: 1; transform: none; } }

    footer {
      position: fixed;
      bottom: 26px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(238,234,226,.22);
      font: 10px ui-monospace, monospace;
      letter-spacing: .16em;
      text-transform: uppercase;
      z-index: 2;
    }

    @media (prefers-reduced-motion: reduce) {
      .aura, .mark, .status .dot { animation: none; }
      .fade { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div class="grain"></div>
  <div class="aura"></div>

  <main>
    <div class="mark fade d1"></div>
    <h1 class="fade d2">CulinArch<span class="dot">.</span>AI</h1>
    <p class="line fade d3">A culinary intelligence architecture is being built.</p>
    <div class="status fade d4"><span class="dot"></span>Private development in progress</div>
  </main>

  <footer>© CulinArch.AI</footer>
</body>
</html>
